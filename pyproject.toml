[project]
name = "buymelaterbot"
version = "0.1.0"
description = "Telegram bot for family shopping lists and tasks with Home Assistant integration"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.6,<3",
    "apscheduler>=3.10,<4",
    "dateparser>=1.2,<2",
    "python-dateutil>=2.9,<3",
    "yargy>=0.16,<1",
    "pymorphy2-dicts-ru>=2.4,<3",
    "setuptools>=75",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "freezegun>=1.5,<2",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*", "bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
